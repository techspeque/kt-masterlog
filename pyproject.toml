[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kt-masterlog"
dynamic = ["version"]
description = "Master-log orchestration layer for KerasTuner. One CSV per tuning run, strategy-agnostic configuration, structured results."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Adam" }]
keywords = ["keras-tuner", "hyperparameter-optimization", "machine-learning", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tensorflow>=2.12",
    "keras-tuner[bayesian]>=1.4",
    "tensorboard>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "git-cliff>=2.0",
]

[project.urls]
Homepage = "https://github.com/techspeque/kt-masterlog"
Issues = "https://github.com/techspeque/kt-masterlog/issues"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "git-cliff>=2.0",
]

[tool.hatch.version]
path = "src/kt_masterlog/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kt_masterlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
